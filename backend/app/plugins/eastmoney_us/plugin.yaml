description: "东方财富美股公开行情(非官方)。全市场目录(约1.4万只, NASDAQ/NYSE/AMEX)、日K(原始价, 美东交易日口径)与1分钟K(北京墙钟时间戳)。免费接口有限频, provider 内置节流。"
