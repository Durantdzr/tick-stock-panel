# 东方财富美股公开行情插件 (非官方, push2.eastmoney.com 公开端点, fs=m:105/106/107)。
# 纯 HTTP REST, 无需 API Key。asset_types: [us] — 声明后不进入 A 股 7 能力路由
# 候选, 由美股同步服务 (services/us_sync.py) 专用。

name: eastmoney_us
display_name: "东方财富·美股"
runtime: none
entry: app.plugins.eastmoney_us.provider:EastmoneyUSProvider
